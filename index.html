<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sept OT Bonanza Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .calculator-card {
      background-color: #1e1e1e;
      border: 2px solid #ffcc00;
      border-radius: 12px;
      padding: 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(255, 204, 0, 0.2);
    }
    h2 {
      text-align: center;
      color: #ffcc00;
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .subtitle {
      text-align: center;
      color: #cccccc;
      font-size: 0.9em;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #e0e0e0;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    input[type="number"]:focus {
      border-color: #ffcc00;
      outline: none;
    }
    input[readonly] {
      background-color: #1a233a;
      border-color: #ffcc00;
      color: #ffcc00;
      font-weight: bold;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: #ffcc00;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #ffcc00;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #e6b800;
    }
    .result-box {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      background-color: #2a2a2a;
      text-align: center;
    }
    .result-title {
      font-size: 0.9em;
      color: #aaa;
    }
    .result-amount {
      font-size: 2rem;
      font-weight: bold;
      color: #ffcc00;
      margin: 8px 0;
    }
    .result-reason {
      font-size: 0.85em;
      color: #d1d1d1;
    }
  </style>
</head>
<body>

<div class="calculator-card">
  <h2>OT Bonanza Calculator</h2>
  <div class="subtitle">Only for chat and voice team</div>

  <div class="form-group">
    <label for="callCount">MTD Call/Chat Count:</label>
    <input type="number" id="callCount" placeholder="Enter total chats/calls (e.g., 1000)" min="0" oninput="updateTotalTransactions()">
  </div>

  <div class="form-group">
    <label for="emailCount">MTD Email Count (3 Emails = 2 transactions):</label>
    <input type="number" id="emailCount" placeholder="Enter total emails (e.g., 300)" min="0" oninput="updateTotalTransactions()">
  </div>

  <div class="form-group">
    <label for="totalTransactions">Total Equivalent Transactions (Auto):</label>
    <input type="number" id="totalTransactions" placeholder="0" readonly>
  </div>

  <div class="form-group">
    <label for="csat">CSAT Percentage (%):</label>
    <input type="number" id="csat" placeholder="Enter CSAT (e.g., 62)" min="0" max="100">
  </div>

  <div class="form-group checkbox-group">
    <input type="checkbox" id="unsavedError">
    <label for="unsavedError">More than 1 unsaved / TG error</label>
  </div>

  <button onclick="calculatePayout()">Calculate Earnings</button>

  <div class="result-box" id="resultBox">
    <div class="result-title">Estimated Bonus Payout</div>
    <div class="result-amount" id="payoutAmount">₹ 0</div>
    <div class="result-reason" id="payoutDetails">Enter your metrics to calculate.</div>
  </div>
</div>

<script>
function updateTotalTransactions() {
  const calls = parseInt(document.getElementById('callCount').value) || 0;
  const emails = parseInt(document.getElementById('emailCount').value) || 0;
  
  // 3 Emails = 2 Calls/Chats
  const totalVolume = calls + (emails * (2 / 3));
  document.getElementById('totalTransactions').value = totalVolume.toFixed(2);
}

function calculatePayout() {
  const calls = parseInt(document.getElementById('callCount').value) || 0;
  const emails = parseInt(document.getElementById('emailCount').value) || 0;
  const csat = parseFloat(document.getElementById('csat').value) || 0;
  const hasUnsavedError = document.getElementById('unsavedError').checked;

  // Automated total transaction sum
  const totalVolume = calls + (emails * (2 / 3));
  document.getElementById('totalTransactions').value = totalVolume.toFixed(2);

  const rateTier1 = 18000 / 1220; // ~14.754
  const rateTier2 = 28000 / 1270; // ~22.047
  const rateTier3 = 38000 / 1340; // ~28.358
  const fallbackRate = 12.21;

  let appliedRate = 0;
  let totalPayout = 0;
  let calculationNote = "";

  // Floor rule: Below 990 total equivalent transactions means zero payout
  if (totalVolume < 990) {
    document.getElementById('payoutAmount').innerText = "₹ 0";
    document.getElementById('payoutDetails').innerText = `No payout: Total equivalent transactions (${totalVolume.toFixed(2)}) are below the minimum limit of 990.`;
    return;
  }

  const meetsRiderConditions = (csat >= 61) && (!hasUnsavedError);

  if (meetsRiderConditions) {
    if (totalVolume >= 1340) {
      appliedRate = rateTier3;
      calculationNote = `Tier 3 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} transactions).`;
    } else if (totalVolume >= 1270) {
      appliedRate = rateTier2;
      calculationNote = `Tier 2 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} transactions).`;
    } else if (totalVolume >= 1220) {
      appliedRate = rateTier1;
      calculationNote = `Tier 1 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} transactions).`;
    } else {
      appliedRate = fallbackRate;
      calculationNote = `Between 990 and 1219 transactions. Fallback rate applied (₹12.21/unit for ${totalVolume.toFixed(2)} transactions).`;
    }
  } else {
    appliedRate = fallbackRate;
    let reasonText = [];
    if (csat < 61) reasonText.push("CSAT is below 61%");
    if (hasUnsavedError) reasonText.push("More than 1 unsaved error");
    
    calculationNote = `Fallback rate applied (₹12.21/unit for ${totalVolume.toFixed(2)} transactions) due to: ${reasonText.join(" and ")}.`;
  }

  totalPayout = totalVolume * appliedRate;

  document.getElementById('payoutAmount').innerText = "₹ " + totalPayout.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  document.getElementById('payoutDetails').innerText = calculationNote;
}
</script>

</body>
</html>
